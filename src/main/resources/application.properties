# Server Port (Render sets the PORT environment variable dynamically)
server.port=${PORT:8080}

# Database Configuration (supports Neon PostgreSQL or H2 based on JDBC URL)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/hospital-management;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Allowed CORS Origins (comma-separated, supports wildcards like *.vercel.app)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,https://*.vercel.app}