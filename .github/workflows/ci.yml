name: SEBASETHU CI Pipeline

on:
  push:
    branches: [ main, Arintak_work ]
  pull_request:
    branches: [ main, Arintak_work ]

jobs:
  backend-build-test:
    name: Backend Build & Unit/Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and Run Backend Tests
        run: |
          chmod +x mvnw
          ./mvnw test -B --no-transfer-progress

  frontend-build:
    name: Frontend Build & Lint Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Frontend Application
        working-directory: ./frontend
        run: npm run build
